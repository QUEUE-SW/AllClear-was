spring:
  application:
    name: ALLCLEAR-was

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DATABASE_URL:default}
    username: ${DATABASE_USERNAME:default}
    password: ${DATABASE_PASSWORD:default}

  sql:
    init:
      mode: never

  profiles:
    active: local

jwt:
  token:
    access:
      expire-time: ${JWT_ACCESS_EXPIRE_TIME:7200000}
      secret-key: ${JWT_ACCESS_SECRET_KEY:thisisexamplesecretkeyforaccesstokenthisisexamplesecretkeyforaccesstokenthisisexamplesecretkey}

springdoc:
  swagger-ui:
    persistAuthorization: true

---
spring:
  config:
    activate:
      on-profile: local
  jpa:
    hibernate:
      ddl-auto: create

logging:
  level:
    com.allclearwas: debug
    org.hibernate.sql: debug
    org.hibernate.orm.jdbc.bind: trace

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    hibernate:
      ddl-auto: none

logging:
  level:
    com.allclearwas: debug
    org.hibernate.sql: debug
    org.hibernate.orm.jdbc.bind: trace
