spring:
  application:
    name: ALLCLEAR-was

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DATABASE_URL:default}
    username: ${DATABASE_USERNAME:default}
    password: ${DATABASE_PASSWORD:default}

  profiles:
    active: local


---
spring:
  config:
    activate:
      on-profile: local
  jpa:
    hibernate:
      ddl-auto: create

logging:
  level:
    com.allclearwas: debug
    org.hibernate.sql: debug
    org.hibernate.orm.jdbc.bind: trace

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    hibernate:
      ddl-auto: none

logging:
  level:
    com.allclearwas: debug
    org.hibernate.sql: debug
    org.hibernate.orm.jdbc.bind: trace
